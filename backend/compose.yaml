x-db-env: &db-env
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_HOST: ${POSTGRES_HOST}
  POSTGRES_PORT: ${POSTGRES_PORT}

x-backend-env: &backend-env
  APP_URL: ${APP_URL}
  APP_NAME: ${APP_NAME}
  DEBUG: ${DEBUG}
  ENVIRONMENT: ${ENVIRONMENT}
  JWT_ALGORITHM: ${JWT_ALGORITHM}
  JWT_SECRET: ${JWT_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES}
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS}
  MAIL_USERNAME: ${MAIL_USERNAME}
  MAIL_PASSWORD: ${MAIL_PASSWORD}
  MAIL_FROM: ${MAIL_FROM}
  MAIL_PORT: ${MAIL_PORT}
  MAIL_SERVER: ${MAIL_SERVER}
  MAIL_STARTTLS: ${MAIL_STARTTLS}
  MAIL_SSL_TLS: ${MAIL_SSL_TLS}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME}

x-redis-env: &redis-env
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PORT: ${REDIS_PORT}

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
  MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}

x-aws-s3-env: &aws-s3-env
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  AWS_REGION: ${AWS_REGION}
  AWS_S3_SECURE: ${AWS_S3_SECURE}
  AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT}
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
  AWS_S3_PUBLIC_ENDPOINT_URL: ${AWS_S3_PUBLIC_ENDPOINT_URL}

services:
  nettie-frontend:
   image: ghcr.io/akr-tashpulatov/nettie:frontend-${APP_RELEASE}
   restart: unless-stopped

  nettie-backend:
    image: ghcr.io/akr-tashpulatov/nettie:backend-${APP_RELEASE}
    ports:
      - 4000:8080
    restart: unless-stopped
    environment:
      <<: [*backend-env, *redis-env, *aws-s3-env, *db-env]
    depends_on:
      nettie-db:
        condition: service_healthy
      nettie-redis:
        condition: service_healthy
      nettie-minio:
        condition: service_healthy

  nettie-migrator:
    image: ghcr.io/akr-tashpulatov/nettie:backend-${APP_RELEASE}
    environment:
      <<: [*backend-env, *redis-env, *aws-s3-env, *db-env]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    command: ["sh", "-c", "alembic upgrade head"]
    depends_on:
      nettie-db:
        condition: service_healthy

  nettie-taskiq-worker:
    image: ghcr.io/akr-tashpulatov/nettie:backend-${APP_RELEASE}
    restart: unless-stopped
    environment:
      <<: [*backend-env, *redis-env, *aws-s3-env, *db-env]
    command: ["sh", "-c", "uv run taskiq worker src.core.broker:broker src.modules.mail.application.tasks"]
    depends_on:
      nettie-db:
        condition: service_healthy

  nettie-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      <<: [*db-env]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nettie-redis:
    image: redis:8.6-alpine
    environment:
      <<: [*redis-env]
    command: >
      sh -c "redis-server --requirepass ${REDIS_PASSWORD}"
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - redis_data:/data

  nettie-minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    restart: unless-stopped
    environment:
      <<: [*minio-env]
    volumes:
      - minio_data:/export
    command: server /export --console-address ":9090"
    healthcheck:
      test: ["CMD", "mc", "alias", "set", "minio", "http://localhost:9000", "${AWS_ACCESS_KEY_ID}", "${AWS_SECRET_ACCESS_KEY}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data: