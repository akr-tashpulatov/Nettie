repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (local)
        entry: uv run ruff check
        language: system
        types: [python]

      - id: mypy
        name: mypy (local)
        entry: uv run mypy .
        language: system
        types: [python]
        pass_filenames: false
