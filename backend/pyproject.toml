[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.2",
    "alembic>=1.18.4",
    "argon2-cffi>=25.1.0",
    "aioboto3>=15.5.0",
    "asyncpg>=0.31.0",
    "fastapi-healthz>=1.3.3",
    "fastapi[standard]>=0.138.0",
    "greenlet>=3.5.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openai>=1.68.0",
    "phonenumbers>=9.0.33",
    "prometheus-fastapi-instrumentator>=8.0.2",
    "psycopg2-binary>=2.9.12",
    "pyjwt>=2.13.0",
    "redis[hiredis]>=8.0.1",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.51",
    "taskiq>=0.12.4",
    "taskiq-redis>=1.2.3",
]

[tool.ruff]
extend-exclude = ["alembic/env.py", "alembic/versions"]
force-exclude = true

[tool.ruff.lint]
extend-select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"src.modules.auth.infrastructure".msg = "application must not import infrastructure — depend on the port in application/ and wire the concrete class in api/dependencies.py"
"src.modules.media.infrastructure".msg = "application must not import infrastructure — depend on the port in application/ and wire the concrete class in api/dependencies.py"
"src.modules.user.infrastructure".msg = "application must not import infrastructure — depend on the port in application/ and wire the concrete class in api/dependencies.py"
"src.modules.test.infrastructure".msg = "application must not import infrastructure — depend on the port in application/ and wire the concrete class in api/dependencies.py"
"src.modules.exam.infrastructure".msg = "application must not import infrastructure — depend on the port in application/ and wire the concrete class in api/dependencies.py"

[tool.ruff.lint.per-file-ignores]
# Composition roots: the API's (api/dependencies.py) and the TaskIQ worker's
# (application/tasks.py), which wires the same graph without FastAPI's Depends.
"src/modules/*/api/dependencies.py" = ["TID251"]
"src/modules/*/application/tasks.py" = ["TID251"]

[[tool.mypy.overrides]]
module = ["fastapi_healthz.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "types-aioboto3[s3]>=15.5.0",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "ruff>=0.15.18",
]
